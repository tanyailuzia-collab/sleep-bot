<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:RC;font-weight:800;src:url(roboto-condensed-cyrillic-800-normal.woff2);unicode-range:U+0400-04FF,U+2116}
@font-face{font-family:RC;font-weight:800;src:url(roboto-condensed-latin-800-normal.woff2);unicode-range:U+0000-03FF,U+2000-206F,U+2190-21FF,U+26A0}
@font-face{font-family:RC;font-weight:900;src:url(roboto-condensed-cyrillic-900-normal.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:RC;font-weight:900;src:url(roboto-condensed-latin-900-normal.woff2);unicode-range:U+0000-03FF,U+2000-206F,U+2190-21FF}
html,body{margin:0;background:#15171c;overflow:hidden}
#s{width:540px;height:960px;display:block}
text{font-family:RC,sans-serif;font-weight:800}
</style></head><body>
<svg id="m" width="10" height="10" style="position:absolute;left:-9999px"></svg><svg id="s" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const W=540,H=960;
const C0={bg:'#0b1626',bg2:'#13243b',bld:'#0f1d31',bldEdge:'#2ec4b6',win:'#ffd28a',winOff:'#1a2c45',or:'#2ec4b6',red:'#ff6b5b',yel:'#ffd166',white:'#ffffff',bp:'#0d2744',bpLine:'#2ec4b6',skin:'#e8b48c',skinD:'#c9906a',hair:'#2b2320',hood:'#3a5a7a',teal:'#2ec4b6',navy:'#0b1626'};
const C={bg:'#1a1030',bg2:'#2a1848',bld:'#22143c',bldEdge:'#f43f75',win:'#f8c838',winOff:'#2e1f4a',or:'#f43f75',red:'#f43f75',yel:'#f8c838',white:'#ffffff',skin:'#e8b48c',skinD:'#c9906a',hair:'#3b2418',sweat:'#5b3a8a',teal:'#9b7bff',navy:'#1a1030',lav:'#e9ddff'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* ---------- shared pieces ---------- */
function bgGrad(id,top,bot){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="540" height="960" fill="url(#${id})"/>`}
function embers(t,n=26,seed=1){let s='';for(let i=0;i<n;i++){const sp=20+rnd(i+seed)*40;const x=(rnd(i*3+seed)*W+Math.sin(t*1.3+i)*14)%W;const y=H-((rnd(i*7+seed)*H+t*sp)%H);const r=0.8+rnd(i*5+seed)*1.8;const o=0.35+0.5*Math.abs(Math.sin(t*2+i));s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#bdeeff" opacity="${o.toFixed(2)}"/>`}return s}
function building(x,y,w,h,seed,t,opts={}){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${opts.fill||C.bld}"/>`;
 if(opts.edge!==false)s+=`<polyline points="${x},${y+h} ${x},${y} ${x+w},${y}" fill="none" stroke="${C.bldEdge}" stroke-width="2" opacity=".85"/>`;
 const cw=opts.cw||10,ch=opts.ch||13,gx=opts.gx||8,gy=opts.gy||10;let k=0;
 for(let yy=y+14;yy<y+h-20;yy+=ch+gy){for(let xx=x+10;xx<x+w-cw-4;xx+=cw+gx){k++;const r=rnd(seed*100+k);let on=r>0.62;
   if(opts.flick&&rnd(seed*31+k)>0.9)on=Math.sin(t*3+k)>0;
   if(opts.allOff)on=false;
   s+=`<rect x="${xx}" y="${yy}" width="${cw}" height="${ch}" fill="${on?C.win:C.winOff}" opacity="${on?0.95:0.8}"/>`}}
 return s}
function skyline(t,seed,baseY,opts={}){let s='';const items=[[-10,240,90],[70,330,70],[130,180,110],[230,290,80],[300,220,120],[410,310,70],[470,200,90]];
 items.forEach((b,i)=>{s+=building(b[0],baseY-b[2]-b[1]*0+0-b[1]+b[2],b[2],b[1]+200,seed+i,t,opts)});return s}
function badge(cx,cy,label,{bg='#dbe9f7',fg='#14365c',size=15,icon='',p=1,stroke='#5b8fc4'}={}){
 const sc=back(p);const w=label.length*size*0.56+(icon?size*1.4:0)+26;
 return `<g transform="translate(${cx} ${cy}) scale(${sc.toFixed(3)})" opacity="${clamp(p*3).toFixed(2)}"><rect x="${-w/2}" y="${-size*1.1}" width="${w}" height="${size*2.2}" rx="7" fill="${bg}" stroke="${stroke}" stroke-width="2"/><text x="0" y="${size*0.38}" font-size="${size}" fill="${fg}" text-anchor="middle" letter-spacing=".5">${icon?icon+' ':''}${label}</text></g>`}
function bigText(x,y,parts,size,p=1,anchor='middle'){const sc=0.6+0.4*back(p);let spans=parts.map(([tx,col])=>`<tspan fill="${col}">${tx}</tspan>`).join('');
 return `<g transform="translate(${x} ${y}) scale(${sc.toFixed(3)})" opacity="${clamp(p*2.5).toFixed(2)}"><text x="0" y="0" font-size="${size}" font-weight="900" text-anchor="${anchor}" stroke="#000" stroke-width="${size*0.12}" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">${spans}</text></g>`}

/* subtitle: chunk = [[word,color],...]; words pop in sequentially */
function subtitle(lines,lt,y=640){let s='';const all=lines.flat();let idx=0;
 lines.forEach((line,li)=>{const size=30;const yy=y+li*36;
   // measure approx positions
   const widths=line.map(([w])=>measure(w,size)+size*0.3);const total=widths.reduce((a,b)=>a+b,0);let x=W/2-total/2;
   line.forEach(([w,col],wi)=>{const p=clamp((lt-idx*0.09)/0.18);idx++;const cx=x+widths[wi]/2;x+=widths[wi];
     if(p<=0)return;const sc=0.7+0.3*back(p);
     s+=`<g transform="translate(${cx.toFixed(1)} ${yy}) scale(${sc.toFixed(3)})" opacity="${clamp(p*2).toFixed(2)}"><text x="0" y="0" font-size="${size}" text-anchor="middle" fill="${col||'#fff'}" stroke="#000" stroke-width="5" stroke-linejoin="round" paint-order="stroke">${w}</text></g>`})});
 return s}
const _mc={};function measure(w,size){const k=w+'|'+size;if(_mc[k])return _mc[k];const svg=document.getElementById('m');svg.innerHTML=`<text font-size="${size}" style="font-family:RC;font-weight:800">${w}</text>`;const v=svg.firstChild.getComputedTextLength();_mc[k]=v;return v}
const Wd=(str,col)=>str.split(' ').map(w=>[w,col]);
function subs(chunks,lt,y){ // chunks: [{t0,lines}]
 if(!window.SUBS)return '';
 let cur=null;for(const c of chunks)if(lt>=c.t0)cur=c;if(!cur)return '';return subtitle(cur.lines,lt-cur.t0,y)}
function vignette(){return `<defs><radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient></defs><rect width="540" height="960" fill="url(#vg)"/>`}
function handle(){return `<text x="${W-16}" y="${H-40}" font-size="13" fill="#fff" opacity=".7" text-anchor="end">@tanyadonchenko_proson</text>`}

/* ---------- «За таблицею, а не за дитиною» · palette A warm orange night · hero mom with bun + baby 8m · device: internet table vs sleep diary ---------- */
const LANG='en';
Object.assign(C,{bg:'#1b1310',or:'#e8892c',red:'#ec3b2e',yel:'#f7b500',white:'#ffffff',skin:'#f0c39e',skinD:'#d29a74',hair:'#4a2a18',top:'#c8553d',cream:'#fff1dc',dark:'#120c0a'});
const L={handle:'@tanyadonchenko_proson'};
const BG=id=>bgGrad(id,'#1b1310','#3a2214');
const oB=(p,size=20)=>({bg:C.cream,fg:'#2a160c',stroke:C.or,size,p});
const rB=(p,size=20)=>({bg:C.red,fg:'#fff',stroke:'#ffb39a',size,p});
const yB=(p,size=20)=>({bg:C.yel,fg:'#2a160c',stroke:'#fff3c4',size,p});
const kB=(p,size=20)=>({bg:'#1b1310',fg:C.yel,stroke:C.yel,size,p});
function warmEmbers(t,n=18,seed=3){let s='';for(let i=0;i<n;i++){const sp=20+rnd(i+seed)*40;const x=(rnd(i*3+seed)*W+Math.sin(t*1.3+i)*14)%W;const y=H-((rnd(i*7+seed)*H+t*sp)%H);const r=0.8+rnd(i*5+seed)*1.8;s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#ffb347" opacity="${(0.3+0.5*Math.abs(Math.sin(t*2+i))).toFixed(2)}"/>`}return s}
function mom(cx,cy,lt,expr,smile=0,sc=1){let s='';const bob=Math.sin(lt*3)*2;
 s+=`<g transform="translate(${cx} ${cy+bob}) scale(${sc})">`;
 s+=`<path d="M -160 360 q 0 -170 160 -180 q 160 10 160 180 z" fill="${C.top}"/>`;
 s+=`<rect x="-24" y="116" width="48" height="66" fill="${C.skinD}"/>`;
 s+=`<circle cx="0" cy="-118" r="46" fill="${C.hair}"/>`;
 s+=`<ellipse cx="0" cy="12" rx="92" ry="108" fill="${C.skin}"/>`;
 s+=`<ellipse cx="-94" cy="20" rx="12" ry="20" fill="${C.skinD}"/><ellipse cx="94" cy="20" rx="12" ry="20" fill="${C.skinD}"/>`;
 s+=`<path d="M -96 6 q -6 -110 96 -112 q 102 2 96 112 q -20 -66 -96 -70 q -76 4 -96 70 z" fill="${C.hair}"/>`;
 const blink=(lt%2.4>2.28)?0.15:1;const lid=expr*13;
 s+=`<ellipse cx="-36" cy="8" rx="19" ry="${21*blink}" fill="#fff"/><ellipse cx="36" cy="8" rx="19" ry="${21*blink}" fill="#fff"/>`;
 if(blink>0.5)s+=`<circle cx="-34" cy="12" r="9" fill="#1d1612"/><circle cx="38" cy="12" r="9" fill="#1d1612"/>`;
 s+=`<rect x="-58" y="-16" width="42" height="${lid+2}" fill="${C.skin}"/><rect x="16" y="-16" width="42" height="${lid+2}" fill="${C.skin}"/>`;
 const br=-expr*6;
 s+=`<path d="M -58 ${-24+br} q 22 ${-10+expr*14} 42 ${-2+expr*6}" stroke="${C.hair}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M 58 ${-24+br} q -22 ${-10+expr*14} -42 ${-2+expr*6}" stroke="${C.hair}" stroke-width="7" fill="none" stroke-linecap="round"/>`;
 if(expr>0.3)s+=`<path d="M -52 40 q 16 ${8+expr*8} 32 0" stroke="#a86a5a" stroke-width="5" fill="none" opacity="${expr}"/><path d="M 20 40 q 16 ${8+expr*8} 32 0" stroke="#a86a5a" stroke-width="5" fill="none" opacity="${expr}"/>`;
 s+=`<path d="M 0 30 q -8 20 6 24" stroke="${C.skinD}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
 const m=smile-expr;s+=`<path d="M -24 82 q 24 ${m*20} 48 0" stroke="#a3324a" stroke-width="7" fill="none" stroke-linecap="round"/>`;
 s+=`<circle cx="-56" cy="56" r="12" fill="#ff8a7a" opacity=".3"/><circle cx="56" cy="56" r="12" fill="#ff8a7a" opacity=".3"/>`;
 return s+`</g>`}
function baby(cx,cy,sc,lt,mood='sleep'){let s=`<g transform="translate(${cx} ${cy}) scale(${sc})">`;
 s+=`<circle cx="0" cy="-30" r="62" fill="${C.skin}"/><ellipse cx="-62" cy="-26" rx="10" ry="15" fill="${C.skinD}"/><ellipse cx="62" cy="-26" rx="10" ry="15" fill="${C.skinD}"/>`;
 s+=`<path d="M -20 -92 q 20 -20 30 4" stroke="${C.hair}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
 if(mood==='sleep')s+=`<path d="M -34 -30 q 10 8 20 0 M 14 -30 q 10 8 20 0" stroke="#3a2a20" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="0" cy="2" r="5" fill="#c97a6a"/>`;
 else if(mood==='awake')s+=`<circle cx="-24" cy="-32" r="9" fill="#1d1612"/><circle cx="24" cy="-32" r="9" fill="#1d1612"/><circle cx="-21" cy="-35" r="3" fill="#fff"/><circle cx="27" cy="-35" r="3" fill="#fff"/><path d="M -16 4 q 16 14 32 0" stroke="#7a2a35" stroke-width="5" fill="none" stroke-linecap="round"/>`;
 else s+=`<ellipse cx="0" cy="6" rx="16" ry="${12+Math.abs(Math.sin(lt*14))*7}" fill="#7a2a35"/><path d="M -34 -26 l 18 -6 M 34 -26 l -18 -6" stroke="#3a2a20" stroke-width="5" stroke-linecap="round"/><path d="M -30 -18 l -4 ${14+(lt*40)%22}" stroke="#ffd9a0" stroke-width="5" stroke-linecap="round"/>`;
 s+=`<circle cx="-40" cy="-8" r="10" fill="#ff8a7a" opacity=".45"/><circle cx="40" cy="-8" r="10" fill="#ff8a7a" opacity=".45"/>`;
 return s+`</g>`}
function cot(cx,cy,w=220){let s=`<g transform="translate(${cx} ${cy})">`;for(let i=0;i<=8;i++){const x=-w/2+i*w/8;s+=`<rect x="${x-4}" y="-20" width="8" height="140" fill="#e6c9a8"/>`}
 s+=`<rect x="${-w/2-10}" y="-30" width="${w+20}" height="14" rx="7" fill="#f3dcc0"/><rect x="${-w/2-10}" y="116" width="${w+20}" height="14" rx="7" fill="#f3dcc0"/>`;return s+`</g>`}
/* signature device: internet age table */
function table(cx,cy,lt,{hl=-1,cross=0}={}){const rows=[['6 MO','2h 30m'],['8 MO','3h'],['10 MO','3h 15m'],['12 MO','3h 30m']];let s=`<g transform="translate(${cx} ${cy})">`;
 s+=`<rect x="-170" y="-30" width="340" height="${rows.length*56+60}" rx="14" fill="${C.cream}" stroke="${C.or}" stroke-width="4"/>`;
 s+=`<rect x="-170" y="-30" width="340" height="50" rx="14" fill="${C.or}"/><text x="0" y="6" font-size="24" font-weight="900" fill="#2a160c" text-anchor="middle">CHART FROM THE INTERNET</text>`;
 rows.forEach((r,i)=>{const y=58+i*56;const on=i===hl;if(on)s+=`<rect x="-160" y="${y-36}" width="320" height="50" rx="8" fill="${C.yel}" opacity="${(0.6+0.3*Math.sin(lt*6)).toFixed(2)}"/>`;
  s+=`<text x="-130" y="${y}" font-size="28" fill="#2a160c">${r[0]}</text><text x="130" y="${y}" font-size="28" fill="#2a160c" text-anchor="end">${r[1]}</text>`});
 if(cross>0){const c=ease(cross);s+=`<line x1="-170" y1="-30" x2="${-170+340*c}" y2="${-30+(rows.length*56+60)*c}" stroke="${C.red}" stroke-width="14" stroke-linecap="round"/>`;
  if(cross>1){const c2=ease(cross-1);s+=`<line x1="170" y1="-30" x2="${170-340*c2}" y2="${-30+(rows.length*56+60)*c2}" stroke="${C.red}" stroke-width="14" stroke-linecap="round"/>`}}
 return s+`</g>`}
function diary(cx,cy,lt,p=1){let s=`<g transform="translate(${cx} ${cy}) scale(${(0.6+0.4*back(p)).toFixed(3)})" opacity="${clamp(p*2)}">`;
 s+=`<rect x="-120" y="-150" width="240" height="300" rx="12" fill="#f7e3c8" stroke="${C.yel}" stroke-width="5"/><rect x="-120" y="-150" width="30" height="300" fill="${C.or}"/>`;
 for(let i=0;i<6;i++){const y=-100+i*44;const d=clamp((lt-0.4-i*0.25)/0.25);s+=`<line x1="-70" y1="${y}" x2="${-70+150*d}" y2="${y}" stroke="#8a5a3a" stroke-width="5" stroke-linecap="round"/>`;if(d>=1)s+=`<path d="M 92 ${y-10} l 8 10 l 14 -18" stroke="#3a9a4a" stroke-width="6" fill="none" stroke-linecap="round"/>`}
 s+=`<text x="10" y="-118" font-size="22" font-weight="900" fill="#2a160c" text-anchor="middle">SLEEP DIARY</text>`;
 return s+`</g>`}
function clockFace(cx,cy,r,lt,txt,col){let s=`<g transform="translate(${cx} ${cy})"><circle r="${r}" fill="${C.dark}" stroke="${col}" stroke-width="8"/>`;
 s+=`<line x1="0" y1="0" x2="${(Math.sin(lt*3)*r*0.6).toFixed(1)}" y2="${(-Math.cos(lt*3)*r*0.6).toFixed(1)}" stroke="${col}" stroke-width="8" stroke-linecap="round"/><circle r="10" fill="${col}"/>`;
 s+=`<text x="0" y="${r+54}" font-size="46" font-weight="900" fill="${col}" text-anchor="middle" stroke="#000" stroke-width="5" paint-order="stroke">${txt}</text></g>`;return s}
/* scenes */
function s1(lt){let s=BG('g1')+warmEmbers(lt,16,4);
 s+=table(270,500,lt,{hl:Math.floor(lt*2)%4});
 s+=bigText(270,140,[['BY THE CHART,',C.yel]],52,lt/0.35);
 s+=bigText(270,200,[['NOT BY THE CHILD?',C.white]],42,(lt-0.15)/0.35);
 s+=badge(270,272,'HYPOTHETICAL SCENARIO',Object.assign(oB((lt-0.5)/0.3,15),{icon:'⚠'}));
 return s}
function s2(lt){let s=BG('g2');
 s+=table(270,330,lt,{hl:1});
 s+=badge(110,120,'DAY 1',kB(lt/0.3,26));
 s+=mom(150,700,lt,0.1,0.4,0.55);s+=cot(390,740,180)+baby(390,760,0.6,lt,'cry');
 s+=badge(390,640,'40 MIN TO FALL ASLEEP',rB((lt-2.2)/0.3,20));
 return s}
function s3(lt){let s=BG('g3')+warmEmbers(lt,10,9);
 s+=badge(110,120,'DAY 2',kB(lt/0.3,26));
 s+=clockFace(270,340,110,lt*0.3,'20 MIN',C.red);
 s+=bigText(270,590,[['NAP',C.white]],40,(lt-0.3)/0.3);
 s+=mom(270,820,lt,0.5,0,0.5);
 const p=clamp((lt-1.8)/0.3);if(p>0){s+=`<g opacity="${p}"><ellipse cx="420" cy="690" rx="92" ry="44" fill="${C.cream}"/><circle cx="360" cy="740" r="9" fill="${C.cream}"/></g><text x="420" y="700" font-size="28" fill="#2a160c" text-anchor="middle" opacity="${p}">TEETH?</text>`}
 return s}
function s4(lt){let s=bgGrad('g4','#0d0807','#22140c');
 s+=`<circle cx="430" cy="160" r="54" fill="${C.cream}"/><circle cx="452" cy="146" r="50" fill="#0d0807"/>`;
 for(let i=0;i<20;i++)s+=`<circle cx="${(rnd(i)*540).toFixed(0)}" cy="${(rnd(i+40)*360).toFixed(0)}" r="1.5" fill="#ffe3b0" opacity="${(0.3+0.5*Math.abs(Math.sin(lt*2+i))).toFixed(2)}"/>`;
 s+=cot(270,620,240)+baby(270,640+Math.sin(lt*6)*6,0.8,lt,'awake');
 s+=badge(120,140,'2:00 AM',kB(lt/0.3,30));
 s+=badge(270,860,'AWAKE FOR AN HOUR',rB((lt-1.0)/0.3,22));
 return s}
function s5(lt){let s=BG('g5');
 const ring=lt<2?Math.sin(lt*40)*6:0;s+=`<g transform="translate(${ring} 0)">`+clockFace(270,300,100,0,'5:00 AM',C.red)+`</g>`;
 s+=badge(110,120,'DAY 3',kB(lt/0.3,26));
 s+=mom(270,700,lt,0.9,0,0.62);
 s+=badge(270,560,'WHAT AM I DOING WRONG?',oB((lt-2.6)/0.3,22));
 return s}
function s6(lt){let s=bgGrad('g6','#1b1310','#2a1a10')+warmEmbers(lt,20,6);
 s+=bigText(270,200,[['ONE NUMBER',C.white]],48,lt/0.35);
 const p=ease((lt-1.4)/0.6);
 s+=`<text x="270" y="460" font-size="130" font-weight="900" fill="${C.red}" text-anchor="middle" stroke="#000" stroke-width="10" paint-order="stroke" opacity="${(1-p*0.6).toFixed(2)}">3h</text>`;
 if(p>0)s+=`<line x1="110" y1="${420}" x2="${110+320*p}" y2="${420}" stroke="${C.white}" stroke-width="12" stroke-linecap="round"/>`;
 const q=clamp((lt-3.6)/0.4);if(q>0)s+=`<g transform="translate(270 680) scale(${(0.5+0.5*back(q)).toFixed(3)})"><text x="0" y="0" font-size="150" font-weight="900" fill="${C.yel}" text-anchor="middle" stroke="#000" stroke-width="10" paint-order="stroke">3h 30m</text></g>`;
 s+=badge(270,800,'HER CHILD\'S OWN NORM',oB((lt-4.4)/0.3,20));
 return s}
function s7(lt){let s=BG('g7');
 s+=`<g transform="translate(0 -40) scale(.7) translate(60 140)">`+table(160,560,lt,{cross:clamp(lt/0.5)*2})+`</g>`;
 s+=diary(390,520,lt,clamp((lt-0.8)/0.4));
 s+=bigText(270,160,[['A CHART DOESN\'T KNOW',C.white]],40,lt/0.3);
 s+=bigText(270,215,[['YOUR CHILD',C.yel]],40,(lt-0.15)/0.3);
 return s}
function s8(lt){let s=`<rect width="540" height="960" fill="#0f0907"/>`+warmEmbers(lt,24,11);
 s+=`<g transform="translate(270 250) scale(${(0.55*back(clamp(lt/0.4))).toFixed(3)}) translate(-270 -520)">`+diary(270,520,lt+3,1)+`</g>`;
 s+=badge(270,430,'FIND YOUR NUMBER',{bg:'#000',fg:C.yel,stroke:C.yel,size:22,p:(lt-0.2)/0.3});
 s+=bigText(270,520,[['WANT HELP',C.white]],44,(lt-0.4)/0.3);
 s+=bigText(270,620,[['FINDING IT?',C.red]],56,(lt-0.8)/0.35);
 s+=bigText(270,690,[['MESSAGE ME',C.yel]],40,(lt-1.2)/0.3);
 s+=badge(270,780,'WHATSAPP OR INSTAGRAM DIRECT',{bg:C.yel,fg:'#2a160c',stroke:'#fff',size:19,p:(lt-1.8)/0.3});
 s+=`<text x="270" y="860" font-size="20" fill="#fff" text-anchor="middle" opacity="${clamp((lt-1.0)*3)}">${L.handle}</text>`;
 return s}
function handle(){return `<text x="${W-16}" y="${H-40}" font-size="13" fill="#fff" opacity=".7" text-anchor="end">${L.handle}</text>`}
