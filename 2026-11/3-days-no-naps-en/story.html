<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:RC;font-weight:800;src:url(roboto-condensed-cyrillic-800-normal.woff2);unicode-range:U+0400-04FF,U+2116}
@font-face{font-family:RC;font-weight:800;src:url(roboto-condensed-latin-800-normal.woff2);unicode-range:U+0000-03FF,U+2000-206F,U+2190-21FF,U+26A0}
@font-face{font-family:RC;font-weight:900;src:url(roboto-condensed-cyrillic-900-normal.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:RC;font-weight:900;src:url(roboto-condensed-latin-900-normal.woff2);unicode-range:U+0000-03FF,U+2000-206F,U+2190-21FF}
html,body{margin:0;background:#120d0a;overflow:hidden}
#s{width:540px;height:960px;display:block}
text{font-family:RC,sans-serif;font-weight:800}
</style></head><body>
<svg id="m" width="10" height="10" style="position:absolute;left:-9999px"></svg><svg id="s" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const W=540,H=960;
const C={bg:'#1b1310',bg2:'#2a1c15',bld:'#241914',bldEdge:'#c96f2a',win:'#f2a33a',winOff:'#3a2a20',or:'#e8892c',red:'#ec3b2e',yel:'#f7b500',white:'#ffffff',bp:'#0d2744',bpLine:'#79b4ea',skin:'#e3a77c',skinD:'#c98a62',hair:'#4a2e1f',hood:'#3b3f45'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* ---------- shared pieces ---------- */
function bgGrad(id,top,bot){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="540" height="960" fill="url(#${id})"/>`}
function embers(t,n=26,seed=1){let s='';for(let i=0;i<n;i++){const sp=20+rnd(i+seed)*40;const x=(rnd(i*3+seed)*W+Math.sin(t*1.3+i)*14)%W;const y=H-((rnd(i*7+seed)*H+t*sp)%H);const r=0.8+rnd(i*5+seed)*1.8;const o=0.35+0.5*Math.abs(Math.sin(t*2+i));s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#ffb24a" opacity="${o.toFixed(2)}"/>`}return s}
function building(x,y,w,h,seed,t,opts={}){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${opts.fill||C.bld}"/>`;
 if(opts.edge!==false)s+=`<polyline points="${x},${y+h} ${x},${y} ${x+w},${y}" fill="none" stroke="${C.bldEdge}" stroke-width="2" opacity=".85"/>`;
 const cw=opts.cw||10,ch=opts.ch||13,gx=opts.gx||8,gy=opts.gy||10;let k=0;
 for(let yy=y+14;yy<y+h-20;yy+=ch+gy){for(let xx=x+10;xx<x+w-cw-4;xx+=cw+gx){k++;const r=rnd(seed*100+k);let on=r>0.62;
   if(opts.flick&&rnd(seed*31+k)>0.9)on=Math.sin(t*3+k)>0;
   if(opts.allOff)on=false;
   s+=`<rect x="${xx}" y="${yy}" width="${cw}" height="${ch}" fill="${on?C.win:C.winOff}" opacity="${on?0.95:0.8}"/>`}}
 return s}
function skyline(t,seed,baseY,opts={}){let s='';const items=[[-10,240,90],[70,330,70],[130,180,110],[230,290,80],[300,220,120],[410,310,70],[470,200,90]];
 items.forEach((b,i)=>{s+=building(b[0],baseY-b[2]-b[1]*0+0-b[1]+b[2],b[2],b[1]+200,seed+i,t,opts)});return s}
function badge(cx,cy,label,{bg='#dbe9f7',fg='#14365c',size=15,icon='',p=1,stroke='#5b8fc4'}={}){
 const sc=back(p);const w=label.length*size*0.56+(icon?size*1.4:0)+26;
 return `<g transform="translate(${cx} ${cy}) scale(${sc.toFixed(3)})" opacity="${clamp(p*3).toFixed(2)}"><rect x="${-w/2}" y="${-size*1.1}" width="${w}" height="${size*2.2}" rx="7" fill="${bg}" stroke="${stroke}" stroke-width="2"/><text x="0" y="${size*0.38}" font-size="${size}" fill="${fg}" text-anchor="middle" letter-spacing=".5">${icon?icon+' ':''}${label}</text></g>`}
function bigText(x,y,parts,size,p=1,anchor='middle'){const sc=0.6+0.4*back(p);let spans=parts.map(([tx,col])=>`<tspan fill="${col}">${tx}</tspan>`).join('');
 return `<g transform="translate(${x} ${y}) scale(${sc.toFixed(3)})" opacity="${clamp(p*2.5).toFixed(2)}"><text x="0" y="0" font-size="${size}" font-weight="900" text-anchor="${anchor}" stroke="#000" stroke-width="${size*0.12}" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">${spans}</text></g>`}

/* subtitle: chunk = [[word,color],...]; words pop in sequentially */
function subtitle(lines,lt,y=640){let s='';const all=lines.flat();let idx=0;
 lines.forEach((line,li)=>{const size=30;const yy=y+li*36;
   // measure approx positions
   const widths=line.map(([w])=>measure(w,size)+size*0.3);const total=widths.reduce((a,b)=>a+b,0);let x=W/2-total/2;
   line.forEach(([w,col],wi)=>{const p=clamp((lt-idx*0.09)/0.18);idx++;const cx=x+widths[wi]/2;x+=widths[wi];
     if(p<=0)return;const sc=0.7+0.3*back(p);
     s+=`<g transform="translate(${cx.toFixed(1)} ${yy}) scale(${sc.toFixed(3)})" opacity="${clamp(p*2).toFixed(2)}"><text x="0" y="0" font-size="${size}" text-anchor="middle" fill="${col||'#fff'}" stroke="#000" stroke-width="5" stroke-linejoin="round" paint-order="stroke">${w}</text></g>`})});
 return s}
const _mc={};function measure(w,size){const k=w+'|'+size;if(_mc[k])return _mc[k];const svg=document.getElementById('m');svg.innerHTML=`<text font-size="${size}" style="font-family:RC;font-weight:800">${w}</text>`;const v=svg.firstChild.getComputedTextLength();_mc[k]=v;return v}
const Wd=(str,col)=>str.split(' ').map(w=>[w,col]);
function subs(chunks,lt,y){ // chunks: [{t0,lines}]
 if(!window.SUBS)return '';
 let cur=null;for(const c of chunks)if(lt>=c.t0)cur=c;if(!cur)return '';return subtitle(cur.lines,lt-cur.t0,y)}
function vignette(){return `<defs><radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient></defs><rect width="540" height="960" fill="url(#vg)"/>`}
function handle(){return `<text x="${W-16}" y="${H-40}" font-size="13" fill="#fff" opacity=".7" text-anchor="end">@donchenkode</text>`}

/* ---------- scenes ---------- */
// S1: title over night city
function s1(lt){const z=1+lt*0.025;let s=bgGrad('g1','#0f0b0a','#3a2214');
 s+=`<circle cx="460" cy="350" r="26" fill="#f6e3b0" opacity=".85"/><circle cx="388" cy="242" r="34" fill="#1a120e" opacity=".0"/>`;
 s+=`<g transform="translate(270 960) scale(${z}) translate(-270 -960)">`;
 // back layer
 s+=`<g opacity=".55">`+[[0,420,100],[95,380,90],[180,460,80],[255,400,110],[360,440,90],[445,390,100]].map((b,i)=>building(b[0],b[1],b[2],600,40+i,lt,{edge:false,fill:'#1d1410'})).join('')+`</g>`;
 // front: the house with the child's window
 s+=building(30,470,150,520,3,lt,{});s+=building(350,430,170,560,5,lt,{flick:true});
 s+=building(190,380,150,620,9,lt,{});
 // child's window highlight (in middle building)
 const pulse=0.6+0.4*Math.sin(lt*6);
 s+=`<rect x="248" y="520" width="34" height="40" fill="${C.yel}" opacity="${pulse}"/><rect x="242" y="514" width="46" height="52" fill="none" stroke="${C.red}" stroke-width="3" opacity="${clamp((lt-0.6)*3)}"/>`;
 s+=`</g>`;
 s+=`<rect y="860" width="540" height="100" fill="#120c09"/>`;
 s+=embers(lt,22,3);
 s+=bigText(270,150,[['3 DAYS ',C.red],['WITHOUT NAPS.',C.white]],44,lt/0.35);
 s+=bigText(270,215,[['WHAT ',C.white],['HAPPENS?',C.yel]],58,(lt-0.15)/0.35);
 s+=badge(270,290,'HYPOTHETICAL SCENARIO',{icon:'⚠',p:(lt-0.5)/0.3});
 s+=subs([{t0:0.3,lines:[[...Wd('ДЕНЬ ПЕРШИЙ.')]]},{t0:1.6,lines:[[...Wd('ДЕННИЙ СОН'),['СКАСОВАНО.',C.red]]]}],lt,700);
 return s}

// S2: clock spinning, awake counter
function s2(lt){let s=bgGrad('g2','#22160f','#3b2416');
 // warm room: blurry shapes
 s+=`<circle cx="90" cy="300" r="120" fill="${C.or}" opacity=".12"/><circle cx="470" cy="620" r="150" fill="${C.red}" opacity=".08"/>`;
 const cx=270,cy=400,R=150,sc=0.9+0.1*ease(lt/0.4)+lt*0.01;
 s+=`<g transform="translate(${cx} ${cy}) scale(${sc.toFixed(3)})">`;
 s+=`<circle r="${R+14}" fill="#2f86c9"/><circle r="${R+6}" fill="#1d5f94"/><circle r="${R}" fill="#f3eadb"/>`;
 for(let i=0;i<12;i++){const a=i*Math.PI/6;const r1=R-14,r2=R-(i%3?26:34);s+=`<line x1="${(Math.sin(a)*r1).toFixed(1)}" y1="${(-Math.cos(a)*r1).toFixed(1)}" x2="${(Math.sin(a)*r2).toFixed(1)}" y2="${(-Math.cos(a)*r2).toFixed(1)}" stroke="#3a2a20" stroke-width="${i%3?3:6}" stroke-linecap="round"/>`}
 const hrs=ease(lt/2.3)*7; const ha=(9+hrs)*30, ma=hrs*360;
 s+=`<line x1="0" y1="0" x2="${(Math.sin(ha*Math.PI/180)*72).toFixed(1)}" y2="${(-Math.cos(ha*Math.PI/180)*72).toFixed(1)}" stroke="#2a1d15" stroke-width="10" stroke-linecap="round"/>`;
 s+=`<line x1="0" y1="0" x2="${(Math.sin(ma*Math.PI/180)*112).toFixed(1)}" y2="${(-Math.cos(ma*Math.PI/180)*112).toFixed(1)}" stroke="${C.red}" stroke-width="6" stroke-linecap="round"/><circle r="10" fill="#2a1d15"/>`;
 s+=`</g>`;
 // motion lines
 for(let i=0;i<5;i++){const o=0.15+0.15*Math.sin(lt*8+i);s+=`<path d="M ${cx+R+40} ${cy-60+i*30} q 20 0 30 ${-8+i*4}" stroke="#fff" stroke-width="3" fill="none" opacity="${o}"/>`;}
 const n=Math.max(1,Math.round(hrs));
 s+=dayBadge(1,lt);s+=badge(270,190,`AWAKE ${n} HOUR${n>1?'S':''}`,{bg:'#fff3d6',fg:'#5a3510',stroke:C.or,size:20,icon:'⏱',p:(lt-0.1)/0.3});
 s+=embers(lt,14,7);
 s+=subs([{t0:0.1,lines:[[...Wd('ВІН ГРАЄ І СМІЄТЬСЯ.')]]},{t0:1.3,lines:[[...Wd('ЗДАЄТЬСЯ, ВСЕ'),['ДОБРЕ…',C.yel]]]}],lt,700);
 return s}

// S3: blueprint body, brain alarm
function s3(lt){let s=`<rect width="540" height="960" fill="${C.bp}"/>`;
 for(let x=30;x<540;x+=60)for(let y=60;y<960;y+=60)s+=`<path d="M ${x-4} ${y} h8 M ${x} ${y-4} v8" stroke="${C.bpLine}" stroke-width="1" opacity=".3"/>`;
 s+=`<text x="40" y="70" font-size="14" fill="${C.bpLine}" opacity=".8" letter-spacing="2">NERVOUS SYSTEM · 18 MONTHS</text>`;
 const sc=1+lt*0.02;
 s+=`<g transform="translate(270 430) scale(${sc.toFixed(3)}) translate(-270 -430)" fill="none" stroke="${C.bpLine}" stroke-width="3" stroke-linejoin="round">`;
 // toddler silhouette: big head, short body
 s+=`<circle cx="270" cy="250" r="78"/>`;
 s+=`<path d="M 238 326 q -6 14 -2 22 L 200 360 q -30 10 -36 50 L 152 500 q -2 14 12 14 q 12 0 14 -14 L 192 430 L 196 520 q 0 10 6 14 L 206 640 q 0 18 20 18 q 18 0 20 -18 L 256 540 h 28 L 294 640 q 2 18 20 18 q 20 0 20 -18 L 338 534 q 6 -4 6 -14 L 348 430 L 362 500 q 2 14 14 14 q 14 0 12 -14 L 376 410 q -6 -40 -36 -50 L 304 348 q 4 -8 -2 -22"/>`;
 s+=`</g>`;
 // brain glow
 const pul=0.5+0.5*Math.sin(lt*10);const ap=ease((lt-0.3)/0.4);
 s+=`<g transform="translate(270 430) scale(${sc.toFixed(3)}) translate(-270 -430)">`;
 s+=`<circle cx="270" cy="235" r="${(40+pul*14)*ap}" fill="${C.red}" opacity="${0.25*ap}"/>`;
 s+=`<path d="M 236 238 q -6 -34 26 -40 q 14 -12 30 0 q 26 4 20 34 q 6 24 -20 26 q -12 10 -28 2 q -26 2 -28 -22 z" fill="${C.red}" opacity="${0.9*ap}" stroke="#ffb0a8" stroke-width="2"/>`;
 // adrenal glands (kidneys area)
 const ap2=ease((lt-0.9)/0.4);
 s+=`<ellipse cx="248" cy="450" rx="14" ry="20" fill="${C.red}" opacity="${0.85*ap2}"/><ellipse cx="292" cy="450" rx="14" ry="20" fill="${C.red}" opacity="${0.85*ap2}"/>`;
 s+=`</g>`;
 // arrows + labels
 s+=`<g opacity="${ap}"><line x1="420" y1="170" x2="${420-ap*90}" y2="${170+ap*48}" stroke="${C.red}" stroke-width="3"/></g>`;
 s+=badge(430,150,'CORTISOL ↑',{bg:C.red,fg:'#fff',stroke:'#ffb0a8',size:18,p:(lt-0.4)/0.3});
 s+=`<g opacity="${ap2}"><line x1="110" y1="560" x2="${110+ap2*120}" y2="${560-ap2*100}" stroke="${C.red}" stroke-width="3"/></g>`;
 s+=badge(120,580,'ADRENALINE ↑',{bg:C.red,fg:'#fff',stroke:'#ffb0a8',size:18,p:(lt-1.0)/0.3});
 s+=subs([{t0:0.1,lines:[[...Wd('АЛЕ МОЗОК ВМИКАЄ')]]},{t0:1.3,lines:[[['АВАРІЙНИЙ',C.red],['РЕЖИМ.',C.red]]]}],lt,760);
 return s}

// S4: shocked mom, 21:00
function mom(cx,cy,lt,expr,tired){let s='';const bob=Math.sin(lt*4)*2;
 s+=`<g transform="translate(${cx} ${cy+bob})">`;
 // body hoodie
 s+=`<path d="M -150 330 q 0 -150 150 -160 q 150 10 150 160 z" fill="#8a4a5c"/><path d="M -40 175 q 40 30 80 0 l -10 40 q -30 16 -60 0 z" fill="#6e3a49"/>`;
 // neck
 s+=`<rect x="-24" y="120" width="48" height="60" fill="${C.skinD}"/>`;
 // hair back
 s+=`<ellipse cx="0" cy="-10" rx="118" ry="130" fill="${C.hair}"/><circle cx="0" cy="-150" r="46" fill="${C.hair}"/>`;
 // face
 s+=`<ellipse cx="0" cy="10" rx="96" ry="112" fill="${C.skin}"/>`;
 s+=`<ellipse cx="-98" cy="18" rx="14" ry="22" fill="${C.skinD}"/><ellipse cx="98" cy="18" rx="14" ry="22" fill="${C.skinD}"/>`;
 // fringe
 s+=`<path d="M -100 -20 q 10 -100 100 -100 q 90 0 100 100 q -40 -60 -110 -50 q -40 10 -90 50 z" fill="${C.hair}"/>`;
 // eyes
 const look=Math.sin(lt*2.2)*6;const blink=(lt%1.6>1.5)?0.15:1;
 s+=`<ellipse cx="-38" cy="6" rx="24" ry="${26*blink}" fill="#fff"/><ellipse cx="38" cy="6" rx="24" ry="${26*blink}" fill="#fff"/>`;
 if(blink>0.5)s+=`<circle cx="${-38+look}" cy="10" r="10" fill="#2a1a12"/><circle cx="${38+look}" cy="10" r="10" fill="#2a1a12"/><circle cx="${-35+look}" cy="6" r="3" fill="#fff"/><circle cx="${41+look}" cy="6" r="3" fill="#fff"/>`;
 if(tired){s+=`<path d="M -64 ${-20} h 52 v 22 h -52 z M 12 ${-20} h 52 v 22 h -52 z" fill="${C.skin}"/><path d="M -62 2 q 24 6 48 0 M 14 2 q 24 6 48 0" stroke="#3a2216" stroke-width="4" fill="none"/>`;
  s+=`<path d="M -60 -30 q 20 -4 44 -14 M 60 -30 q -20 -4 -44 -14" stroke="#3a2216" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M -56 44 q 18 12 36 0 M 20 44 q 18 12 36 0" stroke="#a8705a" stroke-width="5" fill="none"/>`;
  s+=`<path d="M 0 30 q -8 22 6 26" stroke="${C.skinD}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M -18 88 q 18 -6 36 0" stroke="#7a2a25" stroke-width="5" fill="none" stroke-linecap="round"/></g>`;return s}
 // brows raised
 const br=expr*-10;
 s+=`<path d="M -62 ${-30+br} q 24 -16 46 -4" stroke="#3a2216" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M 62 ${-30+br} q -24 -16 -46 -4" stroke="#3a2216" stroke-width="7" fill="none" stroke-linecap="round"/>`;
 // eye bags (tired)
 s+=`<path d="M -56 40 q 18 10 36 0" stroke="${C.skinD}" stroke-width="4" fill="none"/><path d="M 20 40 q 18 10 36 0" stroke="${C.skinD}" stroke-width="4" fill="none"/>`;
 // nose, mouth
 s+=`<path d="M 0 30 q -8 22 6 26" stroke="${C.skinD}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
 const mo=10+expr*14;
 s+=`<ellipse cx="0" cy="84" rx="${12+expr*4}" ry="${mo}" fill="#7a2a25"/><ellipse cx="0" cy="${84+mo*0.45}" rx="${8+expr*2}" ry="${mo*0.35}" fill="#d9675e"/>`;
 s+=`</g>`;return s}
function s4(lt){let s=bgGrad('g4','#2b1a12','#1a110c');
 // blurred window + lamp in background
 s+=`<rect x="40" y="120" width="170" height="240" rx="6" fill="#0e1a2c" opacity=".7"/><circle cx="160" cy="170" r="16" fill="#f6e3b0" opacity=".6"/>`;
 s+=`<circle cx="450" cy="240" r="110" fill="${C.or}" opacity=".18"/><circle cx="450" cy="240" r="50" fill="${C.yel}" opacity=".25"/>`;
 const z=1+lt*0.03;
 s+=`<g transform="translate(270 960) scale(${z.toFixed(3)}) translate(-270 -960)">`+mom(270,520,lt,ease((lt-0.2)/0.3))+`</g>`;
 // toddler running silhouette crossing bottom
 const rx=-80+((lt*260)%700);const leg=Math.sin(lt*22)*14;
 s+=`<g transform="translate(${rx} 928)" fill="#0c0806"><circle cx="0" cy="-92" r="22"/><rect x="-14" y="-72" width="28" height="44" rx="10"/><path d="M -6 -30 l ${-leg} 34 M 6 -30 l ${leg} 34" stroke="#0c0806" stroke-width="12" stroke-linecap="round"/><path d="M -12 -62 l -22 ${10+leg} M 12 -62 l 22 ${10-leg}" stroke="#0c0806" stroke-width="9" stroke-linecap="round"/></g>`;
 s+=embers(lt,12,11);
 s+=badge(270,120,'9 PM · BEDTIME',{bg:'#fff3d6',fg:'#5a3510',stroke:C.or,size:20,icon:'🕘',p:(lt-0.05)/0.3});
 s+=subs([{t0:0.1,lines:[[...Wd('ЗАМІСТЬ ВТОМИ —')]]},{t0:1.1,lines:[[['«ДРУГЕ',C.yel],['ДИХАННЯ».',C.yel]]]}],lt,790);
 return s}

// S5: night, window lighting up with times
function s5(lt){let s=bgGrad('g5','#070912','#1b1420');
 for(let i=0;i<40;i++){s+=`<circle cx="${(rnd(i)*540).toFixed(0)}" cy="${(rnd(i+50)*360).toFixed(0)}" r="${(rnd(i+9)*1.4+0.4).toFixed(1)}" fill="#fff" opacity="${(0.3+0.5*Math.abs(Math.sin(lt*2+i))).toFixed(2)}"/>`}
 s+=`<circle cx="430" cy="150" r="40" fill="#f6e3b0"/><circle cx="414" cy="140" r="40" fill="#070912"/>`;
 const z=1.0+lt*0.04;
 s+=`<g transform="translate(270 560) scale(${z.toFixed(3)}) translate(-270 -560)">`;
 s+=building(40,330,140,700,21,lt,{allOff:true,fill:'#161219'})+building(360,360,150,700,22,lt,{allOff:true,fill:'#161219'});
 // main house
 s+=`<rect x="170" y="280" width="200" height="720" fill="#1d1820"/><polyline points="170,1000 170,280 370,280" fill="none" stroke="#5a6c9a" stroke-width="2"/>`;
 let k=0;for(let y=300;y<900;y+=56)for(let x=188;x<350;x+=42){k++;s+=`<rect x="${x}" y="${y}" width="26" height="34" fill="#2a2430"/>`}
 // the child's window: blinks on at times
 const times=[1.0,2.2,3.6];let on=0;times.forEach(t0=>{if(lt>t0&&lt<t0+0.55)on=1});
 s+=`<rect x="272" y="524" width="26" height="34" fill="${on?C.yel:'#2a2430'}"/>`;
 if(on)s+=`<circle cx="285" cy="541" r="46" fill="${C.yel}" opacity=".22"/>`;
 s+=`</g>`;
 // time badges popping near the window
 const labels=['1:40 AM','3:15 AM','5 AM'];
 labels.forEach((l,i)=>{const p=(lt-times[i])/0.25;if(p>0){const red=i===2;s+=badge(120+i*150,230+(i%2)*50,l,{bg:red?C.red:'#dbe9f7',fg:red?'#fff':'#14365c',stroke:red?'#ffb0a8':'#5b8fc4',size:20,p})}});
 s+=badge(270,140,'NIGHT',{bg:'#1d2440',fg:'#cfe0ff',stroke:'#5a6c9a',size:16,icon:'☾',p:lt/0.3});
 s+=subs([{t0:0.1,lines:[[...Wd('А ВНОЧІ — ПРОБУДЖЕННЯ')]]},{t0:2.6,lines:[[...Wd('І ПІДЙОМ О'),['5:00.',C.red]]]}],lt,700);
 return s}

// S2b: day badge helper
function dayBadge(n,lt){return badge(270,72,'DAY '+n,{bg:C.red,fg:'#fff',stroke:'#ffb0a8',size:16,p:lt/0.25})}

// S6: day 2 — sleep pressure snowballs, car nap
function s6(lt){let s=bgGrad('g6','#22160f','#3a2214');
 s+=dayBadge(2,lt);
 s+=bigText(270,150,[['TIREDNESS ',C.white],['PILES UP',C.red]],44,(lt-0.1)/0.35);

const TOTAL=SCENES.reduce((a,b)=>a+b[1],0);
const XF=0.18;
function frame(t){let acc=0,out='';
 for(let i=0;i<SCENES.length;i++){const [fn,d]=SCENES[i];const st=acc;acc+=d;
  if(t>=st&&t<acc){out=`<g>${fn(t-st)}</g>`;

   if(i<SCENES.length-1&&t>acc-XF){const p=(t-(acc-XF))/XF;const sc=1.08-0.08*p;out+=`<g opacity="${p.toFixed(3)}" transform="translate(270 480) scale(${sc.toFixed(3)}) translate(-270 -480)">${SCENES[i+1][0](0)}</g>`}
   break}}
