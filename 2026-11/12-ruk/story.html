</style></head><body>
<svg id="m" width="10" height="10" style="position:absolute;left:-9999px"></svg><svg id="s" viewBox="0 0 540 960" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const W=540,H=960;
const C0={bg:'#0b1626',bg2:'#13243b',bld:'#0f1d31',bldEdge:'#2ec4b6',win:'#ffd28a',winOff:'#1a2c45',or:'#2ec4b6',red:'#ff6b5b',yel:'#ffd166',white:'#ffffff',bp:'#0d2744',bpLine:'#2ec4b6',skin:'#e8b48c',skinD:'#c9906a',hair:'#2b2320',hood:'#3a5a7a',teal:'#2ec4b6',navy:'#0b1626'};
const C={bg:'#1a1030',bg2:'#2a1848',bld:'#22143c',bldEdge:'#f43f75',win:'#f8c838',winOff:'#2e1f4a',or:'#f43f75',red:'#f43f75',yel:'#f8c838',white:'#ffffff',skin:'#e8b48c',skinD:'#c9906a',hair:'#3b2418',sweat:'#5b3a8a',teal:'#9b7bff',navy:'#1a1030',lav:'#e9ddff'};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

/* ---------- shared pieces ---------- */
function bgGrad(id,top,bot){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="540" height="960" fill="url(#${id})"/>`}
function embers(t,n=26,seed=1){let s='';for(let i=0;i<n;i++){const sp=20+rnd(i+seed)*40;const x=(rnd(i*3+seed)*W+Math.sin(t*1.3+i)*14)%W;const y=H-((rnd(i*7+seed)*H+t*sp)%H);const r=0.8+rnd(i*5+seed)*1.8;const o=0.35+0.5*Math.abs(Math.sin(t*2+i));s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#d8f5a0" opacity="${o.toFixed(2)}"/>`}return s}
function building(x,y,w,h,seed,t,opts={}){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${opts.fill||C.bld}"/>`;
 if(opts.edge!==false)s+=`<polyline points="${x},${y+h} ${x},${y} ${x+w},${y}" fill="none" stroke="${C.bldEdge}" stroke-width="2" opacity=".85"/>`;
 const cw=opts.cw||10,ch=opts.ch||13,gx=opts.gx||8,gy=opts.gy||10;let k=0;
 for(let yy=y+14;yy<y+h-20;yy+=ch+gy){for(let xx=x+10;xx<x+w-cw-4;xx+=cw+gx){k++;const r=rnd(seed*100+k);let on=r>0.62;
   if(opts.flick&&rnd(seed*31+k)>0.9)on=Math.sin(t*3+k)>0;
   if(opts.allOff)on=false;
   s+=`<rect x="${xx}" y="${yy}" width="${cw}" height="${ch}" fill="${on?C.win:C.winOff}" opacity="${on?0.95:0.8}"/>`}}
 return s}
function skyline(t,seed,baseY,opts={}){let s='';const items=[[-10,240,90],[70,330,70],[130,180,110],[230,290,80],[300,220,120],[410,310,70],[470,200,90]];
 items.forEach((b,i)=>{s+=building(b[0],baseY-b[2]-b[1]*0+0-b[1]+b[2],b[2],b[1]+200,seed+i,t,opts)});return s}
function badge(cx,cy,label,{bg='#dbe9f7',fg='#14365c',size=15,icon='',p=1,stroke='#5b8fc4'}={}){
 const sc=back(p);const w=label.length*size*0.56+(icon?size*1.4:0)+26;
 return `<g transform="translate(${cx} ${cy}) scale(${sc.toFixed(3)})" opacity="${clamp(p*3).toFixed(2)}"><rect x="${-w/2}" y="${-size*1.1}" width="${w}" height="${size*2.2}" rx="7" fill="${bg}" stroke="${stroke}" stroke-width="2"/><text x="0" y="${size*0.38}" font-size="${size}" fill="${fg}" text-anchor="middle" letter-spacing=".5">${icon?icon+' ':''}${label}</text></g>`}
function bigText(x,y,parts,size,p=1,anchor='middle'){const sc=0.6+0.4*back(p);let spans=parts.map(([tx,col])=>`<tspan fill="${col}">${tx}</tspan>`).join('');
 return `<g transform="translate(${x} ${y}) scale(${sc.toFixed(3)})" opacity="${clamp(p*2.5).toFixed(2)}"><text x="0" y="0" font-size="${size}" font-weight="900" text-anchor="${anchor}" stroke="#000" stroke-width="${size*0.12}" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">${spans}</text></g>`}

/* subtitle: chunk = [[word,color],...]; words pop in sequentially */
function subtitle(lines,lt,y=640){let s='';const all=lines.flat();let idx=0;
 lines.forEach((line,li)=>{const size=30;const yy=y+li*36;
   // measure approx positions
   const widths=line.map(([w])=>measure(w,size)+size*0.3);const total=widths.reduce((a,b)=>a+b,0);let x=W/2-total/2;
   line.forEach(([w,col],wi)=>{const p=clamp((lt-idx*0.09)/0.18);idx++;const cx=x+widths[wi]/2;x+=widths[wi];
     if(p<=0)return;const sc=0.7+0.3*back(p);
     s+=`<g transform="translate(${cx.toFixed(1)} ${yy}) scale(${sc.toFixed(3)})" opacity="${clamp(p*2).toFixed(2)}"><text x="0" y="0" font-size="${size}" text-anchor="middle" fill="${col||'#fff'}" stroke="#000" stroke-width="5" stroke-linejoin="round" paint-order="stroke">${w}</text></g>`})});
 return s}
const _mc={};function measure(w,size){const k=w+'|'+size;if(_mc[k])return _mc[k];const svg=document.getElementById('m');svg.innerHTML=`<text font-size="${size}" style="font-family:RC;font-weight:800">${w}</text>`;const v=svg.firstChild.getComputedTextLength();_mc[k]=v;return v}
const Wd=(str,col)=>str.split(' ').map(w=>[w,col]);
function subs(chunks,lt,y){ // chunks: [{t0,lines}]
 if(!window.SUBS)return '';
 let cur=null;for(const c of chunks)if(lt>=c.t0)cur=c;if(!cur)return '';return subtitle(cur.lines,lt-cur.t0,y)}
function vignette(){return `<defs><radialGradient id="vg" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient></defs><rect width="540" height="960" fill="url(#vg)"/>`}
function handle(){return `<text x="${W-16}" y="${H-40}" font-size="13" fill="#fff" opacity=".7" text-anchor="end">@tanyadonchenko_proson</text>`}

/* ---------- scenes: «12 рук за вечір» · palette D dark green · hero grandma + baby boy 8m · device hands counter + overstimulation gauge ---------- */
const LANG=(location.search.match(/lang=(\w+)/)||[])[1]||'uk';
Object.assign(C,{bg:'#0f1f1a',bg2:'#1a3329',lime:'#b5e655',or:'#ff9f1c',red:'#ff5a3c',yel:'#ff9f1c',white:'#ffffff',skin:'#f0c39e',skinD:'#d29a74',grey:'#d9d9d9',card:'#3f6b4f',navy:'#0f1f1a',cream:'#eaf7d0'});
const TX={
uk:{h1a:'12 РУК ЗА ВЕЧІР.',h1b:'ЩО БУДЕ З НІЧЧЮ?',hyp:'ГІПОТЕТИЧНИЙ СЦЕНАРІЙ',hands:'РУК',
t18:'18:00',guests:'ГОСТІ!',hours:'ЗА 2 ГОДИНИ',faces:'НОВІ ОБЛИЧЧЯ',noise:'СМІХ · МУЗИКА',
noyawn:'НЕ ПОЗІХАЄ',gauge:'ПЕРЕЗБУДЖЕННЯ',t20:'20:00',bed:'ЧАС СПАТИ',cort:'КОРТИЗОЛ ↑',
arms:'ЛИШЕ НА РУКАХ',m40:'40 ХВ',night:'НІЧ',n1:'1:00',n3:'3:00',n5:'5:00',
spoiled:'РОЗБАЛУВАЛИ',over:'ПЕРЕЗБУДЖЕННЯ',acc:'НАКОПИЧИЛОСЬ ЗА ВЕЧІР',
q:'ЩО РОБИТИ?',quiet:'ТИХА КІМНАТА',minus:'−40 ХВ ДО СНУ',one:'ОДНА ЛЮДИНА',same:'РИТУАЛ ЯК УДОМА',
p2:'ЧАСТИНА 2',p2a:'ЯК ПЕРЕЖИТИ',p2b:'СВЯТКОВІ ВИХІДНІ?',sub:'ПІДПИШИСЬ',dm:'НАПИШІТЬ «СОН» У ДІРЕКТ',handle:'@tanyadonchenko_proson'},
en:{h1a:'12 HANDS IN ONE EVENING.',h1b:'WHAT ABOUT THE NIGHT?',hyp:'HYPOTHETICAL SCENARIO',hands:'HANDS',
t18:'6 pm',guests:'GUESTS!',hours:'IN 2 HOURS',faces:'NEW FACES',noise:'LAUGHTER · MUSIC',
noyawn:'NOT YAWNING',gauge:'OVERSTIMULATION',t20:'8 pm',bed:'BEDTIME',cort:'CORTISOL ↑',
arms:'ONLY IN ARMS',m40:'40 MIN',night:'NIGHT',n1:'1 am',n3:'3 am',n5:'5 am',
spoiled:'SPOILED',over:'OVERSTIMULATED',acc:'BUILT UP ALL EVENING',
q:'WHAT HELPS?',quiet:'A QUIET ROOM',minus:'40 MIN BEFORE BED',one:'ONE PERSON',same:'SAME ROUTINE AS HOME',
p2:'PART 2',p2a:'HOW TO SURVIVE',p2b:'THE HOLIDAY WEEKEND?',sub:'FOLLOW',dm:'WHATSAPP OR INSTAGRAM DM',handle:'@donchenkode'}};
const L=TX[LANG];
const BG=id=>bgGrad(id,'#0b1813','#1a3329');
const gB=(p,size=20)=>({bg:'#eaf7d0',fg:'#0f1f1a',stroke:C.lime,size,p});
const oB=(p,size=20)=>({bg:C.or,fg:'#1b1206',stroke:'#ffd9a0',size,p});
const rB=(p,size=20)=>({bg:C.red,fg:'#fff',stroke:'#ffc2b5',size,p});
function sparks(lt,n=18,seed=3){return embers(lt,n,seed)}
function baby(cx,cy,sc,lt,mood='smile'){let s=`<g transform="translate(${cx} ${cy}) scale(${sc})">`;
s+=`<ellipse cx="0" cy="70" rx="58" ry="62" fill="${C.lime}"/><circle cx="-22" cy="58" r="6" fill="#0f1f1a" opacity=".25"/><circle cx="22" cy="58" r="6" fill="#0f1f1a" opacity=".25"/>`;
const wav=mood==='smile'||mood==='wide'?Math.sin(lt*7)*25:mood==='cry'?-40:0;
s+=`<g transform="rotate(${-wav} -50 40)"><ellipse cx="-66" cy="58" rx="16" ry="30" fill="${C.skin}"/></g><g transform="rotate(${wav} 50 40)"><ellipse cx="66" cy="58" rx="16" ry="30" fill="${C.skin}"/></g>`;
s+=`<circle cx="0" cy="-30" r="62" fill="${C.skin}"/><ellipse cx="-62" cy="-26" rx="10" ry="15" fill="${C.skinD}"/><ellipse cx="62" cy="-26" rx="10" ry="15" fill="${C.skinD}"/>`;
s+=`<path d="M -8 -90 q 8 -24 22 -10 q -10 -4 -10 10 z" fill="#8a5a36"/>`;
if(mood==='sleep')s+=`<path d="M -34 -30 q 10 8 20 0 M 14 -30 q 10 8 20 0" stroke="#3a2a20" stroke-width="5" fill="none" stroke-linecap="round"/>`;
else{const r=mood==='wide'?13:9;s+=`<circle cx="-24" cy="-32" r="${r+5}" fill="#fff"/><circle cx="24" cy="-32" r="${r+5}" fill="#fff"/><circle cx="-24" cy="-30" r="${r}" fill="#1d1612"/><circle cx="24" cy="-30" r="${r}" fill="#1d1612"/><circle cx="-20" cy="-34" r="3" fill="#fff"/><circle cx="28" cy="-34" r="3" fill="#fff"/>`}
if(mood==='smile')s+=`<path d="M -22 0 q 22 22 44 0 z" fill="#a3324a"/>`;
else if(mood==='wide')s+=`<ellipse cx="0" cy="4" rx="10" ry="8" fill="#a3324a"/>`;
else if(mood==='cry')s+=`<ellipse cx="0" cy="6" rx="16" ry="${12+Math.abs(Math.sin(lt*14))*7}" fill="#7a2a35"/><path d="M -30 -18 l -4 ${14+(lt*40)%22}" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/><path d="M 30 -18 l 4 ${14+(lt*40+11)%22}" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/>`;
else s+=`<circle cx="0" cy="2" r="5" fill="#c97a6a"/>`;
s+=`<circle cx="-40" cy="-8" r="10" fill="#ff8a7a" opacity=".45"/><circle cx="40" cy="-8" r="10" fill="#ff8a7a" opacity=".45"/>`;
return s+`</g>`}
function granny(cx,cy,lt,expr=0,sc=1){const bob=Math.sin(lt*3)*2;let s=`<g transform="translate(${cx} ${cy+bob}) scale(${sc})">`;
s+=`<path d="M -150 340 q 0 -160 150 -170 q 150 10 150 170 z" fill="${C.card}"/><path d="M -14 176 l 14 140 l 14 -140" fill="#eaf7d0"/>`;
s+=`<circle cx="-30" cy="230" r="6" fill="${C.or}"/><circle cx="-30" cy="270" r="6" fill="${C.or}"/>`;
s+=`<rect x="-22" y="110" width="44" height="66" fill="${C.skinD}"/><ellipse cx="0" cy="10" rx="88" ry="104" fill="${C.skin}"/>`;
s+=`<circle cx="0" cy="-118" r="40" fill="${C.grey}"/><path d="M -92 30 q -16 -130 92 -128 q 108 -2 92 128 q -10 -70 -92 -80 q -82 10 -92 80 z" fill="${C.grey}"/>`;
const blink=(lt%2.6>2.46)?0.15:1;
s+=`<ellipse cx="-34" cy="10" rx="15" ry="${17*blink}" fill="#fff"/><ellipse cx="34" cy="10" rx="15" ry="${17*blink}" fill="#fff"/>`;
if(blink>0.5)s+=`<circle cx="-32" cy="13" r="8" fill="#1d1612"/><circle cx="36" cy="13" r="8" fill="#1d1612"/>`;
s+=`<rect x="-52" y="-10" width="36" height="${expr*12+1}" fill="${C.skin}"/><rect x="16" y="-10" width="36" height="${expr*12+1}" fill="${C.skin}"/>`;
s+=`<circle cx="-34" cy="10" r="26" fill="none" stroke="#6b4a2a" stroke-width="5"/><circle cx="34" cy="10" r="26" fill="none" stroke="#6b4a2a" stroke-width="5"/><path d="M -8 8 q 8 -6 16 0" stroke="#6b4a2a" stroke-width="5" fill="none"/>`;
s+=`<path d="M -56 ${-30-expr*4} q 22 -10 42 ${expr*8}" stroke="#9a9a9a" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M 56 ${-30-expr*4} q -22 -10 -42 ${expr*8}" stroke="#9a9a9a" stroke-width="6" fill="none" stroke-linecap="round"/>`;
s+=`<path d="M -24 76 q 24 ${(0.6-expr)*22} 48 0" stroke="#a3324a" stroke-width="7" fill="none" stroke-linecap="round"/>`;
s+=`<circle cx="-56" cy="52" r="12" fill="#ff8a7a" opacity=".3"/><circle cx="56" cy="52" r="12" fill="#ff8a7a" opacity=".3"/>`;
return s+`</g>`}
function hand(x,y,ang,sc=1,col=C.skin){return `<g transform="translate(${x} ${y}) rotate(${ang}) scale(${sc})"><rect x="-120" y="-16" width="120" height="32" rx="14" fill="#4c7a5c"/><ellipse cx="10" cy="0" rx="26" ry="22" fill="${col}"/><rect x="18" y="-20" width="26" height="10" rx="5" fill="${col}"/><rect x="22" y="-6" width="28" height="10" rx="5" fill="${col}"/><rect x="18" y="8" width="24" height="10" rx="5" fill="${col}"/></g>`}
function gauge(cx,cy,R,v,label){let s=`<g transform="translate(${cx} ${cy})">`;const seg=[['#b5e655',0,0.45],['#ff9f1c',0.45,0.75],['#ff5a3c',0.75,1]];
seg.forEach(([c,a,b])=>{const a1=Math.PI*(1-a),a2=Math.PI*(1-b);s+=`<path d="M ${Math.cos(a1)*R} ${-Math.sin(a1)*R} A ${R} ${R} 0 0 1 ${Math.cos(a2)*R} ${-Math.sin(a2)*R}" stroke="${c}" stroke-width="26" fill="none"/>`});
const an=Math.PI*(1-clamp(v));s+=`<line x1="0" y1="0" x2="${(Math.cos(an)*(R-20)).toFixed(1)}" y2="${(-Math.sin(an)*(R-20)).toFixed(1)}" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle r="14" fill="#fff"/>`;
s+=`<text x="0" y="48" font-size="20" fill="#eaf7d0" text-anchor="middle" stroke="#000" stroke-width="4" paint-order="stroke">${label}</text>`;
return s+`</g>`}
function garland(lt,y=80){let s=`<path d="M -10 ${y} q 140 60 280 0 q 140 60 280 0" stroke="#2f4a3a" stroke-width="4" fill="none"/>`;
for(let i=0;i<14;i++){const x=i*40+10;const yy=y+Math.sin(i/14*Math.PI*2)*0+((i%7)/7<0.5?1:1)*(Math.sin((x%280)/280*Math.PI)*30);const on=Math.sin(lt*5+i*1.7)>-0.2;
s+=`<circle cx="${x}" cy="${yy+10}" r="9" fill="${[C.lime,C.or,C.red][i%3]}" opacity="${on?1:0.3}"/>`}return s}
function guest(x,y,col,sc=1,lt=0,i=0){const b=Math.sin(lt*4+i)*4;return `<g transform="translate(${x} ${y+b}) scale(${sc})"><path d="M -60 200 q 0 -110 60 -116 q 60 6 60 116 z" fill="${col}"/><circle cx="0" cy="40" r="46" fill="${C.skin}"/><path d="M -46 30 q 0 -60 46 -56 q 46 -4 46 56 q -20 -30 -46 -30 q -26 0 -46 30 z" fill="${['#4a3020','#c9a46a','#2a2a2a','#7a4a2a'][i%4]}"/><path d="M -16 60 q 16 14 32 0" stroke="#a3324a" stroke-width="5" fill="none"/></g>`}
function note(x,y,o){return `<g opacity="${o.toFixed(2)}"><text x="${x}" y="${y}" font-size="40" fill="${C.lime}">♪</text></g>`}
function s1(lt){let s=BG('g1')+sparks(lt,14,2);
const n=Math.max(1,12-Math.floor(clamp(lt/3.2)*11));
const pul=1+0.05*Math.sin(lt*8);
s+=`<g transform="translate(270 560) scale(${(back(clamp(lt/0.4))*pul).toFixed(3)})"><circle r="170" fill="#16301f" stroke="${C.lime}" stroke-width="8"/><text x="0" y="56" font-size="190" font-weight="900" fill="${n>6?C.lime:C.or}" text-anchor="middle">${n}</text><text x="0" y="118" font-size="34" fill="#eaf7d0" text-anchor="middle">🤲 ${L.hands}</text></g>`;
for(let i=0;i<4;i++){const a=lt*0.8+i*Math.PI/2;s+=hand(270+Math.cos(a)*250,560+Math.sin(a)*250,a*180/Math.PI+180,0.8)}
s+=bigText(270,140,[[L.h1a,C.white]],LANG==='en'?40:48,lt/0.35);
s+=bigText(270,200,[[L.h1b,C.or]],LANG==='en'?40:46,(lt-0.15)/0.35);
s+=badge(270,272,L.hyp,Object.assign(gB((lt-0.5)/0.3,15),{icon:'⚠'}));
return s}
function s2(lt){let s=bgGrad('g2','#1a3329','#0f1f1a')+garland(lt,120);
s+=`<rect x="0" y="760" width="540" height="200" fill="#122a1f"/>`;
const dp=ease(lt/0.8);s+=`<rect x="360" y="380" width="150" height="380" fill="#0b1813"/><rect x="${360}" y="380" width="${150*(1-dp*0.8)}" height="380" fill="#6b4a2a"/><circle cx="${360+150*(1-dp*0.8)-16}" cy="580" r="6" fill="${C.or}"/>`;
const cols=['#ff9f1c','#5a8fd8','#c25a8a','#7a6ad8'];
for(let i=0;i<4;i++){const p=ease((lt-0.5-i*0.45)/0.6);if(p<=0)continue;s+=guest(440-p*(120+i*90),560,cols[i],0.9,lt,i)}
s+=baby(110,640,0.85,lt,'smile');
s+=badge(270,250,L.t18,oB(lt/0.3,26));
s+=bigText(270,340,[[L.guests,C.lime]],60,(lt-0.3)/0.35);
return s}
function s3(lt){let s=BG('g3')+sparks(lt,16,7);
const k=Math.min(12,1+Math.floor(lt/0.3));
const side=k%2?1:-1;const ph=(lt%0.3)/0.3;
s+=hand(270-side*(160-ease(ph)*60),560,side>0?0:180,1.3);
s+=hand(270+side*(160+ph*80),620,side>0?180:0,1.3);
s+=baby(270+side*Math.sin(ph*Math.PI)*30,540,1.05,lt,'smile');
s+=badge(420,150,`🤲 ${k}`,oB(1,30));
s+=badge(170,150,L.hours,gB((lt-0.4)/0.3,20));
s+=badge(150,820,L.faces,gB((lt-1.4)/0.3,18));
s+=badge(390,820,L.noise,gB((lt-2.2)/0.3,18));
for(let i=0;i<4;i++){const a=((lt*0.9+i/4)%1);s+=note(60+i*120,760-a*400,(1-a)*0.8)}
return s}
function s4(lt){let s=BG('g4')+sparks(lt,14,9);
const z=1+lt*0.03;s+=`<g transform="translate(270 560) scale(${z.toFixed(3)}) translate(-270 -560)">`+baby(270,600,1.9,lt,'smile')+`</g>`;
s+=gauge(270,250,110,0.2+0.5*ease(lt/2.4),L.gauge);
s+=badge(270,860,L.noyawn,rB((lt-0.8)/0.3,24));
return s}
function s5(lt){let s=bgGrad('g5','#0b1813','#132a20')+stars(lt,22);

function handle(){return `<text x="${W-16}" y="${H-40}" font-size="13" fill="#fff" opacity=".7" text-anchor="end">${L.handle}</text>`}
const SCENES=[[s1,6.5],[s2,4.8],[s3,3.8],[s4,2.8],[s5,5.2],[s6,3.8],[s7,4.4],[s8,5.2],[s9,8.0],[s10,5.5]];

const _st=[];{let a=0;for(const sc of SCENES){_st.push(a);a+=sc[1]}}

window.SFX=[{t:0,name:'drone',vol:.2,dur:TOTAL0},{t:0.02,name:'boom',vol:.5},{t:0.1,name:'clock_fast',vol:.4,dur:3.2},{t:0.55,name:'pop',vol:.45}];

_e.forEach(([i,dt,n,v,d])=>window.SFX.push(Object.assign({t:_st[i]+dt,name:n,vol:v||.5},d?{dur:d}:{})));
const TOTAL=TOTAL0;
const XF=0.18;
function frame(t){let acc=0,out='';
for(let i=0;i<SCENES.length;i++){const [fn,d]=SCENES[i];const st=acc;acc+=d;
if(t>=st&&t<acc){out=`<g>${fn(t-st)}</g>`;

break}}
out+=vignette();
if(t<TOTAL-5.5)out+=handle();
document.getElementById('s').innerHTML=out}
window.TOTAL=TOTAL;window.frame=frame;frame(0.9);
window.FPS=30;
